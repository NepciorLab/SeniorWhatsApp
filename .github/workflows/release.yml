name: Release

# Wydanie powstaje po wypchnięciu tagu, np.:  git tag v1.2.0 && git push origin v1.2.0
# Program sprawdza najnowsze wydanie i pobiera plik SeniorWhatsApp-<wersja>-win-x64.zip (patrz Source/UpdateService.cs).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build single-file exe
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish Source/SeniorWhatsApp.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None -p:Version=$version -o out
          Compress-Archive -Path out/SeniorWhatsApp.exe -DestinationPath "SeniorWhatsApp-$version-win-x64.zip"
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "SeniorWhatsApp-$env:VERSION-win-x64.zip"
          # Nagłówek (informacja o AI, instalacja) + automatycznie wygenerowana lista zmian.
          $header = (Get-Content .github/release-header.md -Raw -Encoding utf8).Replace('{VERSION}', $env:VERSION).Replace('{REPOSITORY}', $env:GITHUB_REPOSITORY)
          $changes = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f tag_name=$tag --jq .body
          Set-Content -Path release-notes.md -Value ($header + "`n`n" + $changes) -Encoding utf8
          gh release create $tag $zip --title "Senior WhatsApp $env:VERSION" --notes-file release-notes.md
